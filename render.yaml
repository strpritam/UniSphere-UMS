services:
  - type: static_site
    name: unisphere-ums-portal
    buildCommand: cd progress-portal && npm install && npm run build
    publishPath: progress-portal/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://unisphere-ums.onrender.com
      - key: VITE_USE_MOCK
        value: "false"
